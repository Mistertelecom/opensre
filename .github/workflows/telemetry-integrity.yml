name: Telemetry integrity

on:
  workflow_dispatch:
    inputs:
      packaged_ci_probe:
        description: "Run only the published macOS binary against live analytics ingestion"
        type: boolean
        default: false
      release_tag:
        description: "Published release tag for the packaged probe (required when enabled)"
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - .github/workflows/telemetry-integrity.yml
      - tests/analytics/**
      - infrastructure/analytics/**
      - infrastructure/observability/**
      - infrastructure/safety/secret_redaction.py
      - surfaces/cli/telemetry.py
      # Identity storage, signing, destination resolution and account state.
      - config/account.py
      - config/secrets/**
      - config/version.py
      - config/constants/account.py
      - config/constants/analytics.py
      - config/constants/billing.py
      - config/constants/environment.py
      - config/constants/organization.py
      - config/constants/paths.py
      - config/constants/runtime_metadata.py
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

concurrency:
  group: telemetry-integrity-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSRE_NO_TELEMETRY: "1"
  OPENSRE_SENTRY_DISABLED: "1"
  OPENSRE_LANGFUSE_DISABLED: "1"
  INTEGRITY_EVIDENCE_DIR: integrity-evidence

jobs:
  native:
    if: ${{ !inputs.packaged_ci_probe }}
    name: Identity and login / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      INTEGRITY_EXPECT_CONTAINER: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Exercise fresh processes, storage, auth transition, and delivery retry
        run: uv run python -m pytest tests/analytics/test_integrity_environments.py --junitxml=integrity-evidence/results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: telemetry-integrity-${{ matrix.os }}
          path: integrity-evidence/

  container:
    if: ${{ !inputs.packaged_ci_probe }}
    name: Container runtime / persistent and fresh identity storage
    runs-on: ubuntu-latest
    container: python:3.12-bookworm
    timeout-minutes: 20
    env:
      INTEGRITY_EXPECT_CONTAINER: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Exercise real Docker detection and persistent versus replaced storage
        run: uv run python -m pytest tests/analytics/test_integrity_environments.py --junitxml=integrity-evidence/results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: telemetry-integrity-container
          path: integrity-evidence/

  packaged-macos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.packaged_ci_probe }}
    name: Published CLI CI detection / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Download and verify the published binary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          mkdir -p integrity-evidence release-binary
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "opensre_*_${TARGET}.tar.gz*" --dir release-binary
          cd release-binary
          shasum -a 256 -c ./*.sha256 | tee ../integrity-evidence/checksum.txt
          tar -xzf ./*.tar.gz
      - name: Validate inherited CI environment and emit live events
        run: uv run --no-project --python 3.12 python tests/analytics/_packaged_ci_probe.py release-binary/opensre integrity-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: packaged-ci-${{ matrix.target }}
          path: integrity-evidence/
